    model:
      display_name: vit_base_patch16_clip_224:openai_ft_in1k
      version: openai_ft_in1k (timm tag)
      architecture:
        family: vision_transformer
        description: Vision Transformer / CLIP image encoder
      parameter_count: 86600000
      parameter_count_exact: false
      trainable_layers: 12 transformer layers, 12 heads, hidden_dim 768 (standard
        ViT-B/16 config)
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: weakly_supervised
        description: 'Pretrain: weakly-supervised contrastive (natural-language supervision,
          no manual class labels); Fine-tune: fully supervised classification'
    training:
      process: OpenAI contrastive image-text pretrain on WIT-400M (CLIP) -> fine-tuned
        on ImageNet-1k in timm (Cherti et al. 2022 scaling-laws recipe)
      objective: 'Pretrain: symmetric contrastive InfoNCE loss between image/text
        embeddings; Fine-tune: cross-entropy classification'
      loss: CLIP symmetric contrastive cross-entropy over cosine similarities w/ learned
        temperature (pretrain) + cross-entropy (fine-tune)
      learning_rate: 'Pretrain (CLIP paper, ViT variants): ~5e-4 w/ cosine decay +
        2000-step warmup; fine-tune-stage LR not publicly documented'
      batch_size: 'Pretrain (CLIP paper): 32,768 global batch; fine-tune-stage batch
        size not publicly documented'
      preprocessing: 224x224 resize/crop, CLIP normalization mean=[0.4815,0.4578,0.4082]
        std=[0.2686,0.2613,0.2758]
    data:
      summary: 'Pretrain: WIT-400M (OpenAI''s private ''WebImageText'', 400M image-text
        pairs); Fine-tune: ImageNet-1k'
      training_datasets:
      - identifier: wit-400m-openai-s-private-webimagetext
        name: WIT-400M (OpenAI's private 'WebImageText', 400M image-text pairs)
        description: ~400M image-text pairs
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k
        description: 1.28M training images
        role: fine_tuning
    io:
      modality: image
      interface: 'Input: RGB (3,224,224) normalized; Output: 1000-way logits or (1,197,768)
        unpooled feature tensor'
      input_format: RGB (3,224,224) normalized
      output_format: 1000-way logits or (1,197,768) unpooled feature tensor
      tokenizer: null
    provenance:
      weights_provider: OpenAI (pretrain) + timm/Ross Wightman (fine-tune), hosted
        on Hugging Face
      checkpoint: timm/vit_base_patch16_clip_224.openai_ft_in1k (HF Hub, safetensors)
      source_url: null
      curation_confidence: null
    legal:
      license: Apache-2.0 (as distributed by timm on HF); original OpenAI CLIP GitHub
        repo code is MIT-licensed (distinct from this checkpoint's stated license)
    eval:
      test_datasets:
      - identifier: imagenet-1k-validation-set
        name: ImageNet-1k validation set
        description: null
      validation_datasets:
      - identifier: imagenet-1k-validation-set
        name: ImageNet-1k validation set
        description: null
    use:
      applications:
      - General image classification
      - compact transfer-learning backbone
      - feature/embedding extraction
      users:
      - Researchers/developers wanting a compact (86M param) CLIP-initialized ViT
        classifier
      limitations:
      - Original CLIP documented weaknesses - fine-grained classification, counting,
        abstract/systematic and some geo/OOD tasks (CLIP paper Limitations)
      - fine-tuning trades away zero-shot versatility
      biases:
      - Extensively documented in CLIP paper Sec.7 Broader Impacts - race/gender association
        biases, surveillance-use risk, biases from uncurated internet data
    people:
      creators:
      - OpenAI (Radford, Kim, Hallacy et al., pretrain) + Ross Wightman/timm (fine-tune)
      organizations:
      - OpenAI + timm/Hugging Face
    lineage:
      base_models:
      - identifier: openai-clip-vit-b-16-image-encoder
        name: OpenAI CLIP ViT-B/16 image encoder
        relationship: fine_tuned_from
