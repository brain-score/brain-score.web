      display_name: vit_large_patch14_clip_224:openai_ft_in1k
      version: Original OpenAI CLIP ViT-L/14 (224px), released January 2022
      architecture:
        family: vision_transformer
        description: Vision Transformer (ViT-L/14), CLIP image encoder
      parameter_count: 304200000
      parameter_count_exact: false
      trainable_layers: 24 transformer blocks; full fine-tune assumed
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: contrastive_pretrain_supervised_finetune
        description: Contrastive pretrain + supervised fine-tune
    training:
      process: CLIP contrastive pretrain on WIT-400M -> direct supervised fine-tune
        on ImageNet-1k (no IN-12k stage)
      objective: CLIP contrastive loss + classification loss (fine-tune)
      loss: Contrastive (pretrain) + cross-entropy (fine-tune, inferred)
      learning_rate: null
      batch_size: null
      preprocessing: 224x224, crop_pct 1.0, bicubic; OpenAI CLIP normalization stats
    data:
      summary: 'Stage1: WIT-400M (OpenAI); Stage2: ImageNet-1k'
      training_datasets:
      - identifier: wit-400m-openai
        name: WIT-400M (OpenAI)
        description: ~400M pairs
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k
