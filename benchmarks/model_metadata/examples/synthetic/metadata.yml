schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/brain-score.web/refs/pull/539/head/benchmarks/model_metadata/schema/model-metadata-v2.schema.json"
model:
  identifier: "example-model"
  display_name: "ExampleNet"
  domain: "vision"
  version: "v1"
  aliases:
    - "ExampleNet"
architecture:
  family: "convolutional_neural_network"
  description: "Convolutional Neural Network"
  parameter_count:
    value: 12345678
    exact: true
  trainable_layers:
    description: "5 weighted layers"
  recurrent: false
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "image -> classification_logits"
  tokenizer: false
  visual_degrees: 8.0
  visual_degrees_description: "8 degrees"
preprocessing:
  description: "Resize to 256, center crop to 224, normalize"
training:
  process: "Single-stage supervised training"
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
      sample_count: 1281167
      sample_unit: "images"
  supervision:
    type: "supervised"
    description: "Fully supervised"
  objectives:
    -
      type: "classification"
      description: "1,000-class image classification"
  hyperparameters:
    learning_rate:
      description: "0.1"
    batch_size:
      value: 256
  loss:
    description: "Cross-entropy"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1k validation"
  validation_datasets:
    -
      description: "ImageNet-1k validation"
artifacts:
  -
    role: "weights"
    provider: "Example weights registry"
    identifier: "example-v1"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/example_model"
    path: "brainscore_vision/models/example_model"
intended_use:
  applications:
    - "Representation learning"
    - "benchmarking"
  users:
    - "Researchers"
    - "students"
  limitations:
    - "Synthetic example only"
  biases:
    - "Inherits biases from ImageNet"
authorship:
  creators:
    - "Brain-Score maintainers"
  organizations:
    - "Brain-Score"
licenses:
  -
    scope: "unspecified"
    name: "Apache-2.0"
    spdx: "Apache-2.0"
references:
  -
    role: "primary"
    url: "https://example.org/example-model"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/example_model"
      path: "brainscore_vision/models/example_model"
  assertions:
    -
      path: "/model/display_name"
      status: "verified"
      source: "curation_workbook"
    -
      path: "/lineage/base_models"
      status: "undocumented"
