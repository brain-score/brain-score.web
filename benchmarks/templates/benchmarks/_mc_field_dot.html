{% if source.status == 'probable' or source.status == 'uncertain' %}
<details class="mc-confidence">
    <summary class="mc-field-dot{% if source.status == 'uncertain' %} is-uncertain{% endif %}" title="{{ source.status|capfirst }} — {{ source.source }}"><span class="mc-sr-only">{{ source.status|capfirst }}: show confidence source</span></summary>
    <span class="mc-confidence-source">{{ source.status|capfirst }} — {{ source.source }}</span>
</details>
{% endif %}
